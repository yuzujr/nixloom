[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nixloom"
version = "0.2.0"
description = "A modular local-AI runtime for NixOS"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
nixloom = "nixloom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
